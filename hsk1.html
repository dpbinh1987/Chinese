<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 1 - Chinese Learning</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        header {
            background: #d71920;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }
        header h1 {
            margin: 0;
            font-size: 32px;
        }
        header p {
            margin: 8px 0 0;
            font-size: 17px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }
        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #d71920;
            text-decoration: none;
            font-weight: bold;
        }
        .flashcard {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .flashcard h2 {
            margin-top: 0;
        }
        #flashWord {
            font-size: 52px;
            font-weight: bold;
            margin-top: 15px;
            color: #d71920;
        }
        #flashPinyin {
            font-size: 22px;
            color: #666;
            margin: 8px 0 15px;
        }
        /* HÌNH FLASHCARD */
        .flash-image {
            width: 220px;
            height: 160px;
            object-fit: contain;
            display: block;
            margin: 15px auto 20px;
            border-radius: 12px;
            background: #f8f8f8;
        }
        .btn-red,
        .btn-orange,
        .btn-gray,
        .btn-green {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            margin: 5px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-red {
            background: #d71920;
            color: white;
        }
        .btn-orange {
            background: #f39c12;
            color: white;
        }
        .btn-gray {
            background: #777;
            color: white;
        }
        .btn-green {
            background: #27ae60;
            color: white;
        }
        .answer {
            display: none;
            margin: 20px 0;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 10px;
        }
        #flashMeaning {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }
        .example {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 10px;
        }
        .example-chinese {
            font-size: 24px;
            font-weight: bold;
            color: #d71920;
        }
        .example-pinyin {
            margin-top: 6px;
            color: #666;
        }
        .example-meaning {
            margin-top: 6px;
        }
        .navigation {
            margin-top: 15px;
        }
        .counter {
            margin-top: 15px;
            font-weight: bold;
        }
        .progress {
            margin-top: 10px;
            color: #555;
        }
        .review-button {
            margin-top: 15px;
        }
        .complete {
            display: none;
            background: #e8f8ee;
            color: #218c4a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }
        .search-box h2 {
            margin-top: 0;
        }
        #searchInput {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        .word-list {
            display: grid;
            gap: 12px;
        }
        .word-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
        }
        .word-card:hover {
            background: #fff8f8;
        }
        .word-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .word-chinese {
            font-size: 25px;
            font-weight: bold;
            color: #d71920;
        }
        .word-pinyin {
            color: #666;
        }
        .word-meaning {
            margin-top: 5px;
        }
        .word-detail {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }
        .word-detail img {
            width: 150px;
            height: 110px;
            object-fit: contain;
            display: block;
            margin: 10px auto;
            border-radius: 8px;
        }
        footer {
            text-align: center;
            padding: 25px;
            color: #777;
            font-size: 14px;
        }
        @media (max-width: 600px) {
            #flashWord {
                font-size: 42px;
            }
            .flash-image {
                width: 180px;
                height: 140px;
            }
            .btn-red,
            .btn-orange,
            .btn-gray,
            .btn-green {
                padding: 9px 11px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>📕 HSK 1</h1>
    <p>基础汉语词汇</p>
</header>
<div class="container">
    <a class="back" href="hsk.html">← Quay lại HSK</a>
    <div id="completeBox" class="complete">
        🎉 Bạn đã nhớ hết các từ trong vòng học này!
    </div>
    <div class="flashcard">
        <h2>🃏 Học từ vựng</h2>
        <div id="flashWord">Đang tải...</div>
        <div id="flashPinyin"></div>
        <!-- HÌNH CỦA TỪ -->
        <img id="flashImage"
             class="flash-image"
             src=""
             alt="Hình minh họa">
        <button class="btn-red" onclick="speakCurrentWord()">
            🔊 Nghe từ
        </button>
        <p>❓ Bạn nhớ nghĩa của từ này không?</p>
        <button class="btn-orange" onclick="showAnswer()">
            👀 Hiện đáp án
        </button>
        <div id="answer" class="answer">
            <div id="flashMeaning"></div>
            <div class="example">
                <div id="exampleChinese" class="example-chinese"></div>
                <div id="examplePinyin" class="example-pinyin"></div>
                <div id="exampleMeaning" class="example-meaning"></div>
                <button class="btn-red" onclick="speakExample()">
                    🔊 Nghe câu ví dụ
                </button>
            </div>
        </div>
        <div>
            <button class="btn-gray" onclick="notRemembered()">
                ❌ Chưa nhớ
            </button>
            <button class="btn-green" onclick="rememberCurrent()">
                ✅ Đã nhớ
            </button>
        </div>
        <div class="navigation">
            <button class="btn-gray" onclick="previousWord()">
                ← Từ trước
            </button>
            <button class="btn-gray" onclick="nextWord()">
                Từ tiếp theo →
            </button>
        </div>
        <div class="counter">
            Từ <span id="currentNumber">0</span> /
            <span id="totalNumber">0</span>
        </div>
        <div class="progress">
            📊 Đã nhớ:
            <span id="rememberedCount">0</span> /
            <span id="totalRemembered">0</span>
        </div>
        <div class="review-button">
            <button class="btn-orange" onclick="reviewRemembered()">
                🔄 Học lại từ đã nhớ
            </button>
        </div>
    </div>
    <div class="search-box">
        <h2>🔍 Tìm từ</h2>
        <input
            type="text"
            id="searchInput"
            placeholder="Nhập chữ Hán, pinyin hoặc nghĩa tiếng Việt..."
            oninput="searchWords()"
        >
    </div>
    <div class="word-list" id="wordList">
        Đang tải dữ liệu...
    </div>
</div>
<footer>
    Chinese Learning © 2026
</footer>
<script>
let words = [];
let studyWords = [];
let currentIndex = 0;
let rememberedWords = JSON.parse(
    localStorage.getItem("hsk1Remembered") || "[]"
);
/* =========================
   PHÁT ÂM TIẾNG TRUNG
========================= */
function speakChinese(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "zh-CN";
    speech.rate = 0.8;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}
function speakCurrentWord() {
    if (studyWords.length === 0) return;
    speakChinese(
        studyWords[currentIndex].chinese
    );
}
function speakExample() {
    if (studyWords.length === 0) return;
    speakChinese(
        studyWords[currentIndex].example
    );
}
/* =========================
   ĐỌC CSV
========================= */
function parseCSV(text) {
    const rows = [];
    let row = [];
    let value = "";
    let insideQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];
        if (char === '"' && insideQuotes && nextChar === '"') {
            value += '"';
            i++;
        } else if (char === '"') {
            insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
            row.push(value);
            value = "";
        } else if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {
            if (char === "\r" && nextChar === "\n") {
                i++;
            }
            row.push(value);
            rows.push(row);
            row = [];
            value = "";
        } else {
            value += char;
        }
    }
    if (value !== "" || row.length > 0) {
        row.push(value);
        rows.push(row);
    }
    return rows;
}
/* =========================
   TẢI DỮ LIỆU
========================= */
async function loadWords() {
    try {
        const response = await fetch("hsk1.csv");
        if (!response.ok) {
            throw new Error(
                "Không đọc được file hsk1.csv"
            );
        }
        const text = await response.text();
        const rows = parseCSV(text);
        words = rows
            .slice(1)
            .filter(row => row.length >= 7)
            .map(row => ({
                chinese: row[0].trim(),
                pinyin: row[1].trim(),
                meaning: row[2].trim(),
                image: row[3].trim(),
                example: row[4].trim(),
                examplePinyin: row[5].trim(),
                exampleMeaning: row[6].trim()
            }));
        if (words.length === 0) {
            throw new Error(
                "File CSV không có dữ liệu."
            );
        }
        document.getElementById(
            "totalRemembered"
        ).textContent = words.length;
        createStudyList();
        displayWords(words);
        updateRememberedCount();
    } catch (error) {
        document.getElementById(
            "flashWord"
        ).textContent = "⚠️ Lỗi";
        document.getElementById(
            "flashPinyin"
        ).textContent = error.message;
    }
}
/* =========================
   TẠO DANH SÁCH HỌC
========================= */
function createStudyList() {
    studyWords = words.filter(
        word =>
            !rememberedWords.includes(
                word.chinese
            )
    );
    currentIndex = 0;
    checkCompleted();
    updateFlashcard();
}
/* =========================
   KIỂM TRA HOÀN THÀNH
========================= */
function checkCompleted() {
    const completeBox =
        document.getElementById(
            "completeBox"
        );
    completeBox.style.display =
        studyWords.length === 0
            ? "block"
            : "none";
}
/* =========================
   CẬP NHẬT FLASHCARD
========================= */
function updateFlashcard() {
    if (studyWords.length === 0) {
        document.getElementById(
            "flashWord"
        ).textContent = "🎉 Hoàn thành!";
        document.getElementById(
            "flashPinyin"
        ).textContent =
            "Bạn đã nhớ hết các từ.";
        document.getElementById(
            "flashImage"
        ).style.display = "none";
        document.getElementById(
            "answer"
        ).style.display = "none";
        document.getElementById(
            "currentNumber"
        ).textContent = "0";
        document.getElementById(
            "totalNumber"
        ).textContent = "0";
        return;
    }
    const word =
        studyWords[currentIndex];
    document.getElementById(
        "flashWord"
    ).textContent =
        word.chinese;
    document.getElementById(
        "flashPinyin"
    ).textContent =
        word.pinyin;
    /* HIỂN THỊ HÌNH */
    const image =
        document.getElementById(
            "flashImage"
        );
    if (word.image) {
        image.src = word.image;
        image.alt =
            "Hình minh họa cho " +
            word.chinese;
        image.style.display = "block";
    } else {
        image.src = "";
        image.style.display = "none";
    }
    document.getElementById(
        "flashMeaning"
    ).textContent =
        word.meaning;
    document.getElementById(
        "exampleChinese"
    ).textContent =
        word.example;
    document.getElementById(
        "examplePinyin"
    ).textContent =
        word.examplePinyin;
    document.getElementById(
        "exampleMeaning"
    ).textContent =
        word.exampleMeaning;
    document.getElementById(
        "currentNumber"
    ).textContent =
        currentIndex + 1;
    document.getElementById(
        "totalNumber"
    ).textContent =
        studyWords.length;
    document.getElementById(
        "answer"
    ).style.display = "none";
}
/* =========================
   HIỆN ĐÁP ÁN
========================= */
function showAnswer() {
    document.getElementById(
        "answer"
    ).style.display = "block";
}
/* =========================
   TỪ TIẾP THEO
========================= */
function nextWord() {
    if (studyWords.length === 0) return;
    currentIndex++;
    if (
        currentIndex >= studyWords.length
    ) {
        currentIndex = 0;
    }
    updateFlashcard();
}
/* =========================
   TỪ TRƯỚC
========================= */
function previousWord() {
    if (studyWords.length === 0) return;
    currentIndex--;
    if (currentIndex < 0) {
        currentIndex =
            studyWords.length - 1;
    }
    updateFlashcard();
}
/* =========================
   ĐÃ NHỚ
========================= */
function rememberCurrent() {
    if (studyWords.length === 0) return;
    const word =
        studyWords[currentIndex].chinese;
    if (!rememberedWords.includes(word)) {
        rememberedWords.push(word);
        localStorage.setItem(
            "hsk1Remembered",
            JSON.stringify(
                rememberedWords
            )
        );
    }
    studyWords.splice(
        currentIndex,
        1
    );
    if (studyWords.length === 0) {
        currentIndex = 0;
        checkCompleted();
        updateRememberedCount();
        updateFlashcard();
        displayWords(words);
        return;
    }
    if (
        currentIndex >= studyWords.length
    ) {
        currentIndex = 0;
    }
    updateRememberedCount();
    updateFlashcard();
    displayWords(words);
}
/* =========================
   CHƯA NHỚ
========================= */
function notRemembered() {
    if (studyWords.length === 0) return;
    const currentWord =
        studyWords[currentIndex];
    studyWords.splice(
        currentIndex,
        1
    );
    studyWords.push(currentWord);
    if (
        currentIndex >= studyWords.length
    ) {
        currentIndex = 0;
    }
    updateFlashcard();
}
/* =========================
   HỌC LẠI TỪ ĐÃ NHỚ
========================= */
function reviewRemembered() {
    if (rememberedWords.length === 0) {
        alert(
            "Bạn chưa có từ nào được đánh dấu Đã nhớ."
        );
        return;
    }
    const confirmReview =
        confirm(
            "Bạn muốn học lại tất cả các từ đã nhớ?"
        );
    if (!confirmReview) return;
    rememberedWords = [];
    localStorage.setItem(
        "hsk1Remembered",
        JSON.stringify([])
    );
    createStudyList();
    updateRememberedCount();
    displayWords(words);
}
/* =========================
   ĐẾM TỪ ĐÃ NHỚ
========================= */
function updateRememberedCount() {
    document.getElementById(
        "rememberedCount"
    ).textContent =
        rememberedWords.length;
}
/* =========================
   DANH SÁCH TỪ
========================= */
function displayWords(list) {
    const wordList =
        document.getElementById(
            "wordList"
        );
    if (list.length === 0) {
        wordList.innerHTML =
            "<p>Không tìm thấy từ nào.</p>";
        return;
    }
    wordList.innerHTML =
        list.map((word, index) => `
            <div
                class="word-card"
                onclick="toggleWord(${index}, '${escapeQuotes(word.chinese)}')"
            >
                <div class="word-main">
                    <div>
                        <div class="word-chinese">
                            ${escapeHTML(word.chinese)}
                        </div>
                        <div class="word-pinyin">
                            ${escapeHTML(word.pinyin)}
                        </div>
                        <div class="word-meaning">
                            ${escapeHTML(word.meaning)}
                        </div>
                    </div>
                    <div>
                        ${rememberedWords.includes(word.chinese)
                            ? "✅"
                            : "📖"}
                    </div>
                </div>
                <div
                    id="detail-${index}"
                    class="word-detail"
                >
                    ${
                        word.image
                            ? `
                                <img
                                    src="${escapeHTML(word.image)}"
                                    alt="${escapeHTML(word.chinese)}"
                                >
                              `
                            : ""
                    }
                    <div>
                        ${escapeHTML(word.example)}
                    </div>
                    <div>
                        ${escapeHTML(word.examplePinyin)}
                    </div>
                    <div>
                        ${escapeHTML(word.exampleMeaning)}
                    </div>
                    <button
                        class="btn-red"
                        onclick="event.stopPropagation(); speakChinese('${escapeQuotes(word.example)}')"
                    >
                        🔊 Nghe câu
                    </button>
                </div>
            </div>
        `).join("");
}
/* =========================
   MỞ / ĐÓNG TỪ
========================= */
function toggleWord(index, chinese) {
    const detail =
        document.getElementById(
            "detail-" + index
        );
    if (!detail) return;
    if (
        detail.style.display === "block"
    ) {
        detail.style.display = "none";
    } else {
        detail.style.display = "block";
    }
}
/* =========================
   TÌM KIẾM
========================= */
function searchWords() {
    const keyword =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();
    if (!keyword) {
        displayWords(words);
        return;
    }
    const result =
        words.filter(word =>
            word.chinese
                .toLowerCase()
                .includes(keyword)
            ||
            word.pinyin
                .toLowerCase()
                .includes(keyword)
            ||
            word.meaning
                .toLowerCase()
                .includes(keyword)
        );
    displayWords(result);
}
/* =========================
   CHỐNG LỖI HTML
========================= */
function escapeHTML(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
function escapeQuotes(text) {
    return String(text)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"');
}
/* =========================
   BẮT ĐẦU
========================= */
loadWords();
</script>
</body>
</html>
