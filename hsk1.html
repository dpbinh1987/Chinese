<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HSK 1 - Chinese Learning</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        header {
            background: #c62828;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            font-size: 18px;
            margin-top: 10px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #c62828;
            text-decoration: none;
        }

        .search {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .word {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);

            cursor: pointer;

            transition: 0.2s;
        }

        .word:hover {
            transform: translateY(-3px);
        }

        .chinese {
            font-size: 30px;
            font-weight: bold;
        }

        .pinyin {
            font-size: 18px;
            color: #c62828;
            margin-top: 5px;
        }

        .meaning {
            color: #666;
            margin-top: 8px;
        }

        .detail {
            display: none;
            border-top: 1px solid #eee;
            margin-top: 15px;
            padding-top: 15px;
        }

        .word.active .detail {
            display: block;
        }

        .example {
            font-size: 20px;
            margin-top: 10px;
        }

        .example-pinyin {
            color: #c62828;
            margin-top: 5px;
        }

        .example-meaning {
            color: #666;
            margin-top: 5px;
        }

    </style>

</head>


<body>


<header>

    <h1>📕 HSK 1</h1>

    <p>基础汉语词汇</p>

</header>


<div class="container">


    <a href="hsk.html" class="back">
        ← 回到 HSK
    </a>


    <input
        type="text"
        id="search"
        class="search"
        placeholder="搜索 Search..."
    >


    <div id="wordList"></div>


</div>


<script>


const words = [

    {
        chinese: "你好",
        pinyin: "nǐ hǎo",
        meaning: "Xin chào",

        example: "你好！你叫什么名字？",

        examplePinyin: "Nǐ hǎo! Nǐ jiào shénme míngzi?",

        exampleMeaning: "Xin chào! Bạn tên là gì?"
    },


    {
        chinese: "我",
        pinyin: "wǒ",
        meaning: "Tôi",

        example: "我是学生。",

        examplePinyin: "Wǒ shì xuésheng.",

        exampleMeaning: "Tôi là học sinh."
    },


    {
        chinese: "你",
        pinyin: "nǐ",
        meaning: "Bạn",

        example: "你好吗？",

        examplePinyin: "Nǐ hǎo ma?",

        exampleMeaning: "Bạn khỏe không?"
    },


    {
        chinese: "他",
        pinyin: "tā",
        meaning: "Anh ấy",

        example: "他是老师。",

        examplePinyin: "Tā shì lǎoshī.",

        exampleMeaning: "Anh ấy là giáo viên."
    },


    {
        chinese: "学生",
        pinyin: "xuésheng",
        meaning: "Học sinh",

        example: "我是学生。",

        examplePinyin: "Wǒ shì xuésheng.",

        exampleMeaning: "Tôi là học sinh."
    }

];


const wordList = document.getElementById("wordList");


function showWords(list) {

    wordList.innerHTML = "";


    list.forEach(function(word) {

        const div = document.createElement("div");

        div.className = "word";


        div.innerHTML = `

            <div class="chinese">
                ${word.chinese}
            </div>

            <div class="pinyin">
                ${word.pinyin}
            </div>

            <div class="meaning">
                ${word.meaning}
            </div>


            <div class="detail">

                <strong>例句 · Câu ví dụ</strong>

                <div class="example">
                    ${word.example}
                </div>

                <div class="example-pinyin">
                    ${word.examplePinyin}
                </div>

                <div class="example-meaning">
                    ${word.exampleMeaning}
                </div>

            </div>

        `;


        div.addEventListener("click", function() {

            div.classList.toggle("active");

        });


        wordList.appendChild(div);

    });

}


showWords(words);


const search = document.getElementById("search");


search.addEventListener("input", function() {

    const keyword = search.value.toLowerCase();


    const filtered = words.filter(function(word) {

        return (

            word.chinese.includes(keyword) ||

            word.pinyin
                .toLowerCase()
                .includes(keyword) ||

            word.meaning
                .toLowerCase()
                .includes(keyword)

        );

    });


    showWords(filtered);

});


</script>


</body>

</html>
