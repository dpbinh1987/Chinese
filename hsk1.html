<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 1 - Chinese Learning</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            color: #333;
        }
        header {
            background: #c62828;
            color: white;
            text-align: center;
            padding: 20px;
        }
        header h1 {
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
        }
        .back {
            display: inline-block;
            margin-bottom: 15px;
            color: #c62828;
            text-decoration: none;
        }
        .flashcard {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        #flashWord {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0 5px;
        }
        #flashPinyin {
            font-size: 22px;
            color: #777;
            margin-bottom: 10px;
        }
        #flashMeaning {
            font-size: 22px;
            color: #c62828;
            margin: 15px 0;
        }
        .answer {
            display: none;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-red {
            background: #c62828;
            color: white;
        }
        .btn-green {
            background: #2e7d32;
            color: white;
        }
        .btn-gray {
            background: #eeeeee;
            color: #333;
        }
        .btn-orange {
            background: #ef6c00;
            color: white;
        }
        .example {
            background: #fafafa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }
        .example-chinese {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .example-pinyin {
            color: #777;
            margin-bottom: 8px;
        }
        .example-meaning {
            color: #555;
        }
        .navigation {
            margin-top: 15px;
        }
        .counter {
            margin-top: 15px;
            color: #666;
        }
        .progress {
            margin-top: 10px;
            font-size: 18px;
            color: #2e7d32;
            font-weight: bold;
        }
        .review-button {
            margin-top: 10px;
        }
        .search-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .word-list {
            background: white;
            border-radius: 10px;
            padding: 10px;
        }
        .word-card {
            border-bottom: 1px solid #eee;
            padding: 15px;
            cursor: pointer;
        }
        .word-card:last-child {
            border-bottom: none;
        }
        .word-card:hover {
            background: #fafafa;
        }
        .word-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .word-chinese {
            font-size: 25px;
            font-weight: bold;
        }
        .word-pinyin {
            color: #777;
        }
        .word-meaning {
            color: #c62828;
        }
        .word-detail {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #fafafa;
            border-radius: 8px;
        }
        .remembered {
            background: #e8f5e9;
        }
        .complete {
            display: none;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
        }
        footer {
            text-align: center;
            color: #888;
            padding: 30px;
        }
    </style>
</head>
<body>
<header>
    <h1>📕 HSK 1</h1>
    <p>基础汉语词汇</p>
</header>
<div class="container">
    <a class="back" href="hsk.html">← Quay lại HSK</a>
    <div id="completeBox" class="complete">
        🎉 Bạn đã nhớ hết các từ trong vòng học này!
    </div>
    <div class="flashcard">
        <h2>🃏 Học từ vựng</h2>
        <div id="flashWord">Đang tải...</div>
        <div id="flashPinyin"></div>
        <button class="btn-red" onclick="speakCurrentWord()">
            🔊 Nghe từ
        </button>
        <p>❓ Bạn nhớ nghĩa của từ này không?</p>
        <button class="btn-orange" onclick="showAnswer()">
            👀 Hiện đáp án
        </button>
        <div id="answer" class="answer">
            <div id="flashMeaning"></div>
            <div class="example">
                <div id="exampleChinese" class="example-chinese"></div>
                <div id="examplePinyin" class="example-pinyin"></div>
                <div id="exampleMeaning" class="example-meaning"></div>
                <button class="btn-red" onclick="speakExample()">
                    🔊 Nghe câu ví dụ
                </button>
            </div>
        </div>
        <div>
            <button class="btn-gray" onclick="notRemembered()">
                ❌ Chưa nhớ
            </button>
            <button class="btn-green" onclick="rememberCurrent()">
                ✅ Đã nhớ
            </button>
        </div>
        <div class="navigation">
            <button class="btn-gray" onclick="previousWord()">
                ← Từ trước
            </button>
            <button class="btn-gray" onclick="nextWord()">
                Từ tiếp theo →
            </button>
        </div>
        <div class="counter">
            Từ <span id="currentNumber">0</span>
            /
            <span id="totalNumber">0</span>
        </div>
        <div class="progress">
            📊 Đã nhớ:
            <span id="rememberedCount">0</span>
            /
            <span id="totalRemembered">0</span>
        </div>
        <div class="review-button">
            <button
                class="btn-orange"
                onclick="reviewRemembered()"
            >
                🔄 Học lại từ đã nhớ
            </button>
        </div>
    </div>
    <div class="search-box">
        <h2>🔍 Tìm từ</h2>
        <input
            type="text"
            id="searchInput"
            placeholder="Nhập chữ Hán, pinyin hoặc nghĩa tiếng Việt..."
            oninput="searchWords()"
        >
    </div>
    <div class="word-list" id="wordList">
        Đang tải dữ liệu...
    </div>
</div>
<footer>
    Chinese Learning © 2026
</footer>
<script>
let words = [];
/*
   Hàng đợi học.
   Ví dụ:
   你好 → 我 → 你
*/
let studyWords = [];
let currentIndex = 0;
/* =========================
   TỪ ĐÃ NHỚ
========================= */
let rememberedWords = JSON.parse(
    localStorage.getItem("hsk1Remembered") || "[]"
);
/* =========================
   ĐỌC TIẾNG TRUNG
========================= */
function speakChinese(text) {
    const speech =
        new SpeechSynthesisUtterance(text);
    speech.lang = "zh-CN";
    speech.rate = 0.8;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}
/* =========================
   ĐỌC TỪ
========================= */
function speakCurrentWord() {
    if (studyWords.length === 0) return;
    speakChinese(
        studyWords[currentIndex].chinese
    );
}
/* =========================
   ĐỌC CÂU
========================= */
function speakExample() {
    if (studyWords.length === 0) return;
    speakChinese(
        studyWords[currentIndex].example
    );
}
/* =========================
   PARSE CSV
========================= */
function parseCSV(text) {
    const rows = [];
    let row = [];
    let value = "";
    let insideQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {
            value += '"';
            i++;
        } else if (char === '"') {
            insideQuotes = !insideQuotes;
        } else if (
            char === "," &&
            !insideQuotes
        ) {
            row.push(value);
            value = "";
        } else if (
            (char === "\n" || char === "\r") &&
            !insideQuotes
        ) {
            if (
                char === "\r" &&
                next === "\n"
            ) {
                i++;
            }
            row.push(value);
            if (
                row.some(
                    cell => cell.trim() !== ""
                )
            ) {
                rows.push(row);
            }
            row = [];
            value = "";
        } else {
            value += char;
        }
    }
    if (
        value !== "" ||
        row.length > 0
    ) {
        row.push(value);
        if (
            row.some(
                cell => cell.trim() !== ""
            )
        ) {
            rows.push(row);
        }
    }
    return rows;
}
/* =========================
   LOAD CSV
========================= */
async function loadWords() {
    try {
        const response =
            await fetch("hsk1.csv");
        if (!response.ok) {
            throw new Error(
                "Không đọc được file hsk1.csv"
            );
        }
        const text =
            await response.text();
        const rows =
            parseCSV(text);
        words =
            rows
                .slice(1)
                .filter(
                    row => row.length >= 6
                )
                .map(row => ({
                    chinese: row[0].trim(),
                    pinyin: row[1].trim(),
                    meaning: row[2].trim(),
                    example: row[3].trim(),
                    examplePinyin: row[4].trim(),
                    exampleMeaning: row[5].trim()
                }));
        if (words.length === 0) {
            throw new Error(
                "File CSV không có dữ liệu."
            );
        }
        document.getElementById(
            "totalRemembered"
        ).textContent =
            words.length;
        createStudyList();
        displayWords(words);
        updateRememberedCount();
    } catch (error) {
        document.getElementById(
            "flashWord"
        ).textContent =
            "⚠️ Lỗi";
        document.getElementById(
            "flashPinyin"
        ).textContent =
            error.message;
    }
}
/* =========================
   TẠO HÀNG ĐỢI
========================= */
function createStudyList() {
    /*
       Chỉ lấy từ chưa nhớ.
    */
    studyWords =
        words.filter(
            word =>
                !rememberedWords.includes(
                    word.chinese
                )
        );
    currentIndex = 0;
    checkCompleted();
    updateFlashcard();
}
/* =========================
   HOÀN THÀNH
========================= */
function checkCompleted() {
    const completeBox =
        document.getElementById(
            "completeBox"
        );
    if (studyWords.length === 0) {
        completeBox.style.display =
            "block";
    } else {
        completeBox.style.display =
            "none";
    }
}
/* =========================
   FLASHCARD
========================= */
function updateFlashcard() {
    if (studyWords.length === 0) {
        document.getElementById(
            "flashWord"
        ).textContent =
            "🎉 Hoàn thành!";
        document.getElementById(
            "flashPinyin"
        ).textContent =
            "Bạn đã nhớ hết các từ.";
        document.getElementById(
            "answer"
        ).style.display =
            "none";
        document.getElementById(
            "currentNumber"
        ).textContent =
            "0";
        document.getElementById(
            "totalNumber"
        ).textContent =
            "0";
        return;
    }
    const word =
        studyWords[currentIndex];
    document.getElementById(
        "flashWord"
    ).textContent =
        word.chinese;
    document.getElementById(
        "flashPinyin"
    ).textContent =
        word.pinyin;
    document.getElementById(
        "flashMeaning"
    ).textContent =
        word.meaning;
    document.getElementById(
        "exampleChinese"
    ).textContent =
        word.example;
    document.getElementById(
        "examplePinyin"
    ).textContent =
        word.examplePinyin;
    document.getElementById(
        "exampleMeaning"
    ).textContent =
        word.exampleMeaning;
    document.getElementById(
        "currentNumber"
    ).textContent =
        currentIndex + 1;
    document.getElementById(
        "totalNumber"
    ).textContent =
        studyWords.length;
    document.getElementById(
        "answer"
    ).style.display =
        "none";
}
/* =========================
   HIỆN ĐÁP ÁN
========================= */
function showAnswer() {
    document.getElementById(
        "answer"
    ).style.display =
        "block";
}
/* =========================
   TỪ TIẾP THEO
========================= */
function nextWord() {
    if (studyWords.length === 0) {
        return;
    }
    currentIndex++;
    if (
        currentIndex >=
        studyWords.length
    ) {
        currentIndex = 0;
    }
    updateFlashcard();
}
/* =========================
   TỪ TRƯỚC
========================= */
function previousWord() {
    if (studyWords.length === 0) {
        return;
    }
    currentIndex--;
    if (currentIndex < 0) {
        currentIndex =
            studyWords.length - 1;
    }
    updateFlashcard();
}
/* =========================
   ĐÃ NHỚ
========================= */
function rememberCurrent() {
    if (studyWords.length === 0) {
        return;
    }
    const word =
        studyWords[currentIndex].chinese;
    if (
        !rememberedWords.includes(word)
    ) {
        rememberedWords.push(word);
        localStorage.setItem(
            "hsk1Remembered",
            JSON.stringify(
                rememberedWords
            )
        );
    }
    /*
       Xóa từ khỏi hàng đợi.
    */
    studyWords.splice(
        currentIndex,
        1
    );
    /*
       Nếu đã nhớ hết.
    */
    if (
        studyWords.length === 0
    ) {
        currentIndex = 0;
        checkCompleted();
        updateRememberedCount();
        updateFlashcard();
        displayWords(words);
        return;
    }
    /*
       Nếu vừa xóa từ cuối,
       quay về từ đầu.
    */
    if (
        currentIndex >=
        studyWords.length
    ) {
        currentIndex = 0;
    }
    updateRememberedCount();
    updateFlashcard();
    displayWords(words);
}
/* =========================
   CHƯA NHỚ
========================= */
function notRemembered() {
    if (studyWords.length === 0) {
        return;
    }
    /*
       Lấy từ hiện tại.
    */
    const currentWord =
        studyWords[currentIndex];
    /*
       Xóa nó khỏi vị trí hiện tại.
    */
    studyWords.splice(
        currentIndex,
        1
    );
    /*
       Đưa xuống cuối hàng đợi.
    */
    studyWords.push(
        currentWord
    );
    /*
       currentIndex vẫn giữ nguyên.
       Vì từ tiếp theo đã được
       đưa lên vị trí hiện tại.
    */
    if (
        currentIndex >=
        studyWords.length
    ) {
        currentIndex = 0;
    }
    updateFlashcard();
}
/* =========================
   HỌC LẠI TỪ ĐÃ NHỚ
========================= */
function reviewRemembered() {
    if (
        rememberedWords.length === 0
    ) {
        alert(
            "Bạn chưa có từ nào được đánh dấu Đã nhớ."
        );
        return;
    }
    const confirmReview =
        confirm(
            "Bạn muốn học lại tất cả các từ đã nhớ?"
        );
    if (!confirmReview) {
        return;
    }
    rememberedWords = [];
    localStorage.setItem(
        "hsk1Remembered",
        JSON.stringify([])
    );
    createStudyList();
    updateRememberedCount();
    displayWords(words);
}
/* =========================
   SỐ TỪ ĐÃ NHỚ
========================= */
function updateRememberedCount() {
    document.getElementById(
        "rememberedCount"
    ).textContent =
        rememberedWords.length;
}
/* =========================
   DANH SÁCH TỪ
========================= */
function displayWords(list) {
    const wordList =
        document.getElementById(
            "wordList"
        );
    wordList.innerHTML = "";
    list.forEach(word => {
        const div =
            document.createElement(
                "div"
            );
        div.className =
            "word-card";
        if (
            rememberedWords.includes(
                word.chinese
            )
        ) {
            div.classList.add(
                "remembered"
            );
        }
        const safeExample =
            word.example.replace(
                /'/g,
                "\\'"
            );
        div.innerHTML = `
            <div class="word-main">
                <div>
                    <div class="word-chinese">
                        ${word.chinese}
                    </div>
                    <div class="word-pinyin">
                        ${word.pinyin}
                    </div>
                </div>
                <div class="word-meaning">
                    ${word.meaning}
                </div>
            </div>
            <div class="word-detail">
                <div>
                    ${word.example}
                </div>
                <div class="word-pinyin">
                    ${word.examplePinyin}
                </div>
                <div>
                    ${word.exampleMeaning}
                </div>
                <button
                    class="btn-red"
                    onclick="event.stopPropagation(); speakChinese('${safeExample}')"
                >
                    🔊 Nghe câu
                </button>
            </div>
        `;
        div.onclick =
            function () {
                const detail =
                    div.querySelector(
                        ".word-detail"
                    );
                if (
                    detail.style.display ===
                    "block"
                ) {
                    detail.style.display =
                        "none";
                } else {
                    detail.style.display =
                        "block";
                }
            };
        wordList.appendChild(div);
    });
}
/* =========================
   TÌM KIẾM
========================= */
function searchWords() {
    const keyword =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();
    if (!keyword) {
        displayWords(words);
        return;
    }
    const result =
        words.filter(word =>
            word.chinese
                .toLowerCase()
                .includes(keyword)
            ||
            word.pinyin
                .toLowerCase()
                .includes(keyword)
            ||
            word.meaning
                .toLowerCase()
                .includes(keyword)
        );
    displayWords(result);
}
/* =========================
   START
========================= */
loadWords();
</script>
</body>
</html>
