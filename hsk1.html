<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 1 - Chinese Learning</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background: #c62828;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }
        header h1 {
            margin: 0;
            font-size: 30px;
        }
        header p {
            margin: 8px 0 0;
            font-size: 16px;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 15px;
        }
        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #c62828;
            text-decoration: none;
            font-weight: bold;
        }
        .search {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        /* =========================
           FLASHCARD
        ========================= */
        .flashcard-box {
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 30px;
        }
        .flashcard-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .flashcard-chinese {
            font-size: 48px;
            font-weight: bold;
            color: #c62828;
            margin: 20px 0;
        }
        .flashcard-question {
            font-size: 18px;
            color: #555;
            margin: 20px 0;
        }
        .answer {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
        }
        .answer.show {
            display: block;
        }
        .answer-meaning {
            font-size: 24px;
            font-weight: bold;
        }
        .answer-pinyin {
            margin-top: 8px;
            font-size: 18px;
            color: #666;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }
        .speak {
            background: #c62828;
            color: white;
            margin: 5px;
        }
        .speak:hover {
            background: #a91f1f;
        }
        .show-answer {
            background: #333;
            color: white;
            margin-top: 15px;
        }
        .show-answer:hover {
            background: #111;
        }
        .navigation {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
        }
        .navigation button {
            background: #eee;
            color: #333;
        }
        .navigation button:hover {
            background: #ddd;
        }
        .counter {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
        }
        /* =========================
           WORD LIST
        ========================= */
        .word {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: 0.2s;
        }
        .word:hover {
            transform: translateY(-2px);
        }
        .chinese {
            font-size: 32px;
            font-weight: bold;
            color: #c62828;
        }
        .pinyin {
            font-size: 18px;
            color: #555;
            margin-top: 5px;
        }
        .meaning {
            font-size: 17px;
            margin-top: 8px;
        }
        .detail {
            display: none;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .word.active .detail {
            display: block;
        }
        .example {
            font-size: 22px;
            margin-top: 12px;
        }
        .example-pinyin {
            margin-top: 6px;
            color: #666;
            font-size: 16px;
        }
        .example-meaning {
            margin-top: 6px;
            color: #555;
            font-size: 16px;
        }
        footer {
            text-align: center;
            padding: 30px 15px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
<header>
    <h1>📕 HSK 1</h1>
    <p>基础汉语词汇</p>
</header>
<div class="container">
    <a href="hsk.html" class="back">← Quay lại HSK</a>
    <!-- =========================
         FLASHCARD
    ========================= -->
    <div class="flashcard-box">
        <div class="flashcard-title">
            🃏 Học từ vựng
        </div>
        <div id="flashcardChinese" class="flashcard-chinese">
            你好
        </div>
        <button id="speakWord" class="speak">
            🔊 Nghe từ
        </button>
        <div class="flashcard-question">
            ❓ Bạn nhớ nghĩa của từ này không?
        </div>
        <button id="showAnswer" class="show-answer">
            👀 Hiện đáp án
        </button>
        <div id="answer" class="answer">
            <div id="answerMeaning" class="answer-meaning">
                Xin chào
            </div>
            <div id="answerPinyin" class="answer-pinyin">
                nǐ hǎo
            </div>
            <button id="speakExample" class="speak">
                🔊 Nghe câu ví dụ
            </button>
        </div>
        <div class="navigation">
            <button id="previous">
                ← Từ trước
            </button>
            <button id="next">
                Từ tiếp theo →
            </button>
        </div>
        <div id="counter" class="counter">
            1 / 5
        </div>
    </div>
    <!-- =========================
         SEARCH
    ========================= -->
    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔍 Tìm từ tiếng Trung, pinyin hoặc nghĩa..."
    >
    <!-- =========================
         WORD LIST
    ========================= -->
    <div id="wordList"></div>
</div>
<footer>
    Chinese Learning © 2026
</footer>
<script>
const words = [
    {
        chinese: "你好",
        pinyin: "nǐ hǎo",
        meaning: "Xin chào",
        example: "你好！你叫什么名字？",
        examplePinyin: "Nǐ hǎo! Nǐ jiào shénme míngzi?",
        exampleMeaning: "Xin chào! Bạn tên là gì?"
    },
    {
        chinese: "我",
        pinyin: "wǒ",
        meaning: "Tôi",
        example: "我是学生。",
        examplePinyin: "Wǒ shì xuésheng.",
        exampleMeaning: "Tôi là học sinh."
    },
    {
        chinese: "你",
        pinyin: "nǐ",
        meaning: "Bạn",
        example: "你好吗？",
        examplePinyin: "Nǐ hǎo ma?",
        exampleMeaning: "Bạn khỏe không?"
    },
    {
        chinese: "他",
        pinyin: "tā",
        meaning: "Anh ấy",
        example: "他是老师。",
        examplePinyin: "Tā shì lǎoshī.",
        exampleMeaning: "Anh ấy là giáo viên."
    },
    {
        chinese: "学生",
        pinyin: "xuésheng",
        meaning: "Học sinh",
        example: "我是学生。",
        examplePinyin: "Wǒ shì xuésheng.",
        exampleMeaning: "Tôi là học sinh."
    }
];
/* =========================
   PHÁT ÂM
========================= */
function speakChinese(text) {
    const speech =
        new SpeechSynthesisUtterance(text);
    speech.lang = "zh-CN";
    speech.rate = 0.8;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}
/* =========================
   FLASHCARD
========================= */
let currentIndex = 0;
const flashcardChinese =
    document.getElementById("flashcardChinese");
const answer =
    document.getElementById("answer");
const answerMeaning =
    document.getElementById("answerMeaning");
const answerPinyin =
    document.getElementById("answerPinyin");
const counter =
    document.getElementById("counter");
function showFlashcard() {
    const word = words[currentIndex];
    flashcardChinese.textContent =
        word.chinese;
    answerMeaning.textContent =
        word.meaning;
    answerPinyin.textContent =
        word.pinyin;
    counter.textContent =
        (currentIndex + 1) + " / " + words.length;
    answer.classList.remove("show");
}
/* Hiện đáp án */
document
    .getElementById("showAnswer")
    .addEventListener("click", function() {
        answer.classList.add("show");
    });
/* Đọc từ */
document
    .getElementById("speakWord")
    .addEventListener("click", function() {
        speakChinese(words[currentIndex].chinese);
    });
/* Đọc câu ví dụ */
document
    .getElementById("speakExample")
    .addEventListener("click", function() {
        speakChinese(words[currentIndex].example);
    });
/* Từ trước */
document
    .getElementById("previous")
    .addEventListener("click", function() {
        currentIndex--;
        if (currentIndex < 0) {
            currentIndex = words.length - 1;
        }
        showFlashcard();
    });
/* Từ tiếp theo */
document
    .getElementById("next")
    .addEventListener("click", function() {
        currentIndex++;
        if (currentIndex >= words.length) {
            currentIndex = 0;
        }
        showFlashcard();
    });
/* Hiển thị flashcard đầu tiên */
showFlashcard();
/* =========================
   WORD LIST
========================= */
const wordList =
    document.getElementById("wordList");
function showWords(list) {
    wordList.innerHTML = "";
    if (list.length === 0) {
        wordList.innerHTML = `
            <p style="text-align:center; color:#888;">
                Không tìm thấy từ này 😢
            </p>
        `;
        return;
    }
    list.forEach(function(word) {
        const div =
            document.createElement("div");
        div.className = "word";
        div.innerHTML = `
            <div class="chinese">
                ${word.chinese}
            </div>
            <div class="pinyin">
                ${word.pinyin}
            </div>
            <div class="meaning">
                ${word.meaning}
            </div>
            <div class="detail">
                <strong>例句 · Câu ví dụ</strong>
                <div class="example">
                    ${word.example}
                </div>
                <div class="example-pinyin">
                    ${word.examplePinyin}
                </div>
                <div class="example-meaning">
                    ${word.exampleMeaning}
                </div>
                <button class="speak-example speak">
                    🔊 Nghe câu
                </button>
            </div>
        `;
        const exampleButton =
            div.querySelector(".speak-example");
        exampleButton.addEventListener(
            "click",
            function(event) {
                event.stopPropagation();
                speakChinese(word.example);
            }
        );
        div.addEventListener(
            "click",
            function() {
                div.classList.toggle("active");
            }
        );
        wordList.appendChild(div);
    });
}
showWords(words);
/* =========================
   SEARCH
========================= */
const search =
    document.getElementById("search");
search.addEventListener(
    "input",
    function() {
        const keyword =
            search.value
                .toLowerCase()
                .trim();
        const filtered =
            words.filter(function(word) {
                return (
                    word.chinese.includes(keyword) ||
                    word.pinyin
                        .toLowerCase()
                        .includes(keyword) ||
                    word.meaning
                        .toLowerCase()
                        .includes(keyword)
                );
            });
        showWords(filtered);
    }
);
</script>
</body>
</html>
