<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HSK 1 - Chinese Learning</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        header {
            background: #c62828;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            font-size: 18px;
            margin-top: 10px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #c62828;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }

        .word {
            background: white;
            padding: 25px;
            margin-bottom: 15px;
            border-radius: 12px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }

        .chinese {
            font-size: 30px;
            font-weight: bold;
        }

        .pinyin {
            font-size: 18px;
            color: #c62828;
            margin-top: 5px;
        }

        .meaning {
            color: #666;
            margin-top: 8px;
        }

    </style>

</head>


<body>

<header>

    <h1>📕 HSK 1</h1>

    <p>基础汉语词汇</p>

</header>


<div class="container">

    <a href="hsk.html" class="back">
        ← 回到 HSK
    </a>


    <div class="word">

        <div class="chinese">你好</div>

        <div class="pinyin">
            nǐ hǎo
        </div>

        <div class="meaning">
            Xin chào
        </div>

    </div>


    <div class="word">

        <div class="chinese">我</div>

        <div class="pinyin">
            wǒ
        </div>

        <div class="meaning">
            Tôi
        </div>

    </div>


    <div class="word">

        <div class="chinese">你</div>

        <div class="pinyin">
            nǐ
        </div>

        <div class="meaning">
            Bạn
        </div>

    </div>


    <div class="word">

        <div class="chinese">他</div>

        <div class="pinyin">
            tā
        </div>

        <div class="meaning">
            Anh ấy
        </div>

    </div>


    <div class="word">

        <div class="chinese">学生</div>

        <div class="pinyin">
            xuésheng
        </div>

        <div class="meaning">
            Học sinh
        </div>

    </div>

</div>

</body>

</html>
