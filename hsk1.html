<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 1 - Chinese Learning</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f5f5;
    color: #333;
}
header {
    background: #c62828;
    color: white;
    text-align: center;
    padding: 25px 10px;
}
header h1 {
    margin: 0;
}
.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}
.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #c62828;
    text-decoration: none;
    font-weight: bold;
}
.flashcard {
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 25px;
}
.flashcard h2 {
    font-size: 42px;
    margin: 10px 0;
}
.pinyin {
    color: #777;
    font-size: 20px;
    margin-bottom: 10px;
}
button {
    border: none;
    padding: 10px 16px;
    margin: 5px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}
.listen {
    background: #2196f3;
    color: white;
}
.answer-btn {
    background: #ff9800;
    color: white;
}
.remember {
    background: #4caf50;
    color: white;
}
.not-remember {
    background: #f44336;
    color: white;
}
.nav-btn {
    background: #eeeeee;
}
.answer {
    margin: 15px 0;
    padding: 15px;
    background: #f1f8e9;
    border-radius: 10px;
}
.hidden {
    display: none;
}
.progress {
    margin-top: 15px;
    font-weight: bold;
}
.search {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 20px;
}
.word-card {
    background: white;
    padding: 18px;
    margin-bottom: 12px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 1px 5px rgba(0,0,0,0.08);
}
.word-card:hover {
    background: #fff8f8;
}
.word {
    font-size: 28px;
    font-weight: bold;
}
.meaning {
    margin-top: 5px;
    color: #555;
}
.example {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid #eee;
}
.example-pinyin {
    color: #777;
    margin: 5px 0;
}
.example-meaning {
    color: #555;
}
footer {
    text-align: center;
    padding: 25px;
    color: #777;
}
</style>
</head>
<body>
<header>
    <h1>📕 HSK 1</h1>
    <p>基础汉语词汇</p>
</header>
<div class="container">
    <a class="back" href="hsk.html">
        ← Quay lại HSK
    </a>
    <!-- FLASHCARD -->
    <div class="flashcard">
        <h2 id="flashWord">
            Đang tải...
        </h2>
        <div id="flashPinyin" class="pinyin"></div>
        <button class="listen" onclick="speakCurrentWord()">
            🔊 Nghe từ
        </button>
        <p>
            ❓ Bạn nhớ nghĩa của từ này không?
        </p>
        <button class="answer-btn" onclick="showAnswer()">
            👀 Hiện đáp án
        </button>
        <div id="answer" class="answer hidden">
            <div id="flashMeaning"></div>
            <div id="flashExample"></div>
            <div id="flashExamplePinyin"></div>
            <button class="listen" onclick="speakCurrentExample()">
                🔊 Nghe câu ví dụ
            </button>
        </div>
        <div>
            <button class="not-remember" onclick="notRemember()">
                ❌ Chưa nhớ
            </button>
            <button class="remember" onclick="remember()">
                ✅ Đã nhớ
            </button>
        </div>
        <div>
            <button class="nav-btn" onclick="previousWord()">
                ← Từ trước
            </button>
            <button class="nav-btn" onclick="nextWord()">
                Từ tiếp theo →
            </button>
        </div>
        <div id="counter"></div>
        <div id="progress" class="progress"></div>
    </div>
    <!-- SEARCH -->
    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔍 Tìm từ tiếng Trung, pinyin hoặc nghĩa..."
        oninput="searchWords()"
    >
    <!-- WORD LIST -->
    <div id="wordList"></div>
</div>
<footer>
    Chinese Learning © 2026
</footer>
<script>
let words = [];
let currentIndex = 0;
let rememberedWords =
    JSON.parse(
        localStorage.getItem("hsk1Remembered") || "[]"
    );
// ================================
// ĐỌC FILE CSV
// ================================
async function loadWords() {
    try {
        const response =
            await fetch("hsk1.csv");
        if (!response.ok) {
            throw new Error(
                "Không đọc được file hsk1.csv"
            );
        }
        const text =
            await response.text();
        const rows =
            parseCSV(text);
        words =
            rows
                .slice(1)
                .filter(row => row.length >= 6)
                .map(row => ({
                    chinese: row[0],
                    pinyin: row[1],
                    meaning: row[2],
                    example: row[3],
                    examplePinyin: row[4],
                    exampleMeaning: row[5]
                }));
        if (words.length === 0) {
            throw new Error(
                "File CSV không có dữ liệu."
            );
        }
        updateFlashcard();
        displayWords(words);
    }
    catch (error) {
        document.getElementById(
            "flashWord"
        ).textContent = "⚠️ Lỗi";
        document.getElementById(
            "flashPinyin"
        ).textContent = error.message;
    }
}
// ================================
// ĐỌC CSV
// ================================
function parseCSV(text) {
    const rows = [];
    let row = [];
    let cell = "";
    let inQuotes = false;
    for (
        let i = 0;
        i < text.length;
        i++
    ) {
        const c = text[i];
        const next = text[i + 1];
        if (c === '"') {
            if (
                inQuotes &&
                next === '"'
            ) {
                cell += '"';
                i++;
            }
            else {
                inQuotes = !inQuotes;
            }
        }
        else if (
            c === "," &&
            !inQuotes
        ) {
            row.push(cell);
            cell = "";
        }
        else if (
            (c === "\n" || c === "\r") &&
            !inQuotes
        ) {
            if (
                c === "\r" &&
                next === "\n"
            ) {
                i++;
            }
            row.push(cell);
            cell = "";
            if (
                row.some(
                    x => x !== ""
                )
            ) {
                rows.push(row);
            }
            row = [];
        }
        else {
            cell += c;
        }
    }
    row.push(cell);
    if (
        row.some(
            x => x !== ""
        )
    ) {
        rows.push(row);
    }
    return rows;
}
// ================================
// PHÁT ÂM
// ================================
function speakChinese(text) {
    const speech =
        new SpeechSynthesisUtterance(text);
    speech.lang = "zh-CN";
    speech.rate = 0.8;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}
// ================================
// FLASHCARD
// ================================
function updateFlashcard() {
    if (!words.length) return;
    const word =
        words[currentIndex];
    document.getElementById(
        "flashWord"
    ).textContent =
        word.chinese;
    document.getElementById(
        "flashPinyin"
    ).textContent =
        word.pinyin;
    document.getElementById(
        "flashMeaning"
    ).textContent =
        "🇻🇳 " + word.meaning;
    document.getElementById(
        "flashExample"
    ).textContent =
        "例句： " + word.example;
    document.getElementById(
        "flashExamplePinyin"
    ).textContent =
        word.examplePinyin;
    document.getElementById(
        "counter"
    ).textContent =
        (currentIndex + 1)
        + " / "
        + words.length;
    document.getElementById(
        "answer"
    ).classList.add("hidden");
    updateProgress();
}
function showAnswer() {
    document.getElementById(
        "answer"
    ).classList.remove("hidden");
}
function speakCurrentWord() {
    speakChinese(
        words[currentIndex].chinese
    );
}
function speakCurrentExample() {
    speakChinese(
        words[currentIndex].example
    );
}
// ================================
// NHỚ / CHƯA NHỚ
// ================================
function remember() {
    const word =
        words[currentIndex].chinese;
    if (
        !rememberedWords.includes(word)
    ) {
        rememberedWords.push(word);
    }
    localStorage.setItem(
        "hsk1Remembered",
        JSON.stringify(rememberedWords)
    );
    updateProgress();
    nextWord();
}
function notRemember() {
    const word =
        words[currentIndex].chinese;
    rememberedWords =
        rememberedWords.filter(
            item => item !== word
        );
    localStorage.setItem(
        "hsk1Remembered",
        JSON.stringify(rememberedWords)
    );
    updateProgress();
    nextWord();
}
function updateProgress() {
    document.getElementById(
        "progress"
    ).textContent =
        "📊 Đã nhớ: "
        + rememberedWords.length
        + " / "
        + words.length;
}
// ================================
// CHUYỂN TỪ
// ================================
function nextWord() {
    if (!words.length) return;
    currentIndex =
        (currentIndex + 1)
        % words.length;
    updateFlashcard();
}
function previousWord() {
    if (!words.length) return;
    currentIndex =
        (
            currentIndex - 1
            + words.length
        )
        % words.length;
    updateFlashcard();
}
// ================================
// DANH SÁCH TỪ
// ================================
function displayWords(list) {
    const wordList =
        document.getElementById(
            "wordList"
        );
    wordList.innerHTML = "";
    list.forEach(word => {
        const card =
            document.createElement(
                "div"
            );
        card.className =
            "word-card";
        const example =
            document.createElement(
                "div"
            );
        example.className =
            "example hidden";
        example.innerHTML = `
            <div>
                ${escapeHTML(
                    word.example
                )}
            </div>
            <div class="example-pinyin">
                ${escapeHTML(
                    word.examplePinyin
                )}
            </div>
            <div class="example-meaning">
                ${escapeHTML(
                    word.exampleMeaning
                )}
            </div>
        `;
        const button =
            document.createElement(
                "button"
            );
        button.className =
            "listen";
        button.textContent =
            "🔊 Nghe câu";
        button.onclick =
            function(event) {
                event.stopPropagation();
                speakChinese(
                    word.example
                );
            };
        example.appendChild(button);
        card.innerHTML = `
            <div class="word">
                ${escapeHTML(
                    word.chinese
                )}
            </div>
            <div class="pinyin">
                ${escapeHTML(
                    word.pinyin
                )}
            </div>
            <div class="meaning">
                🇻🇳 ${escapeHTML(
                    word.meaning
                )}
            </div>
        `;
        card.appendChild(example);
        card.addEventListener(
            "click",
            function() {
                example.classList.toggle(
                    "hidden"
                );
            }
        );
        wordList.appendChild(card);
    });
}
// ================================
// TÌM KIẾM
// ================================
function searchWords() {
    const keyword =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();
    const filtered =
        words.filter(word =>
            word.chinese.includes(
                keyword
            )
            ||
            word.pinyin
                .toLowerCase()
                .includes(keyword)
            ||
            word.meaning
                .toLowerCase()
                .includes(keyword)
        );
    displayWords(filtered);
}
// ================================
// BẢO VỆ HTML
// ================================
function escapeHTML(text) {
    return String(text)
        .replace(
            /[&<>"']/g,
            function(match) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[match];
            }
        );
}
// ================================
// KHỞI ĐỘNG
// ================================
loadWords();
</script>
</body>
</html>
