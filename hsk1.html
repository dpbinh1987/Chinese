<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 1 - Chinese Learning</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            color: #333;
        }
        header {
            background: #c62828;
            color: white;
            text-align: center;
            padding: 20px;
        }
        header h1 {
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
        }
        .back {
            display: inline-block;
            margin-bottom: 15px;
            color: #c62828;
            text-decoration: none;
        }
        .flashcard {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        #flashWord {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0 5px;
        }
        #flashPinyin {
            font-size: 22px;
            color: #777;
            margin-bottom: 10px;
        }
        #flashMeaning {
            font-size: 22px;
            color: #c62828;
            margin: 15px 0;
        }
        .answer {
            display: none;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-red {
            background: #c62828;
            color: white;
        }
        .btn-green {
            background: #2e7d32;
            color: white;
        }
        .btn-gray {
            background: #eeeeee;
            color: #333;
        }
        .btn-orange {
            background: #ef6c00;
            color: white;
        }
        .example {
            background: #fafafa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }
        .example-chinese {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .example-pinyin {
            color: #777;
            margin-bottom: 8px;
        }
        .example-meaning {
            color: #555;
        }
        .navigation {
            margin-top: 15px;
        }
        .counter {
            margin-top: 15px;
            color: #666;
        }
        .progress {
            margin-top: 10px;
            font-size: 18px;
            color: #2e7d32;
            font-weight: bold;
        }
        .search-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .word-list {
            background: white;
            border-radius: 10px;
            padding: 10px;
        }
        .word-card {
            border-bottom: 1px solid #eee;
            padding: 15px;
            cursor: pointer;
        }
        .word-card:last-child {
            border-bottom: none;
        }
        .word-card:hover {
            background: #fafafa;
        }
        .word-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .word-chinese {
            font-size: 25px;
            font-weight: bold;
        }
        .word-pinyin {
            color: #777;
        }
        .word-meaning {
            color: #c62828;
        }
        .word-detail {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background: #fafafa;
            border-radius: 8px;
        }
        .remembered {
            background: #e8f5e9;
        }
        footer {
            text-align: center;
            color: #888;
            padding: 30px;
        }
    </style>
</head>
<body>
<header>
    <h1>📕 HSK 1</h1>
    <p>基础汉语词汇</p>
</header>
<div class="container">
    <a class="back" href="hsk.html">← Quay lại HSK</a>
    <!-- FLASHCARD -->
    <div class="flashcard">
        <h2>🃏 Học từ vựng</h2>
        <div id="flashWord">Đang tải...</div>
        <div id="flashPinyin"></div>
        <button class="btn-red" onclick="speakCurrentWord()">
            🔊 Nghe từ
        </button>
        <p>❓ Bạn nhớ nghĩa của từ này không?</p>
        <button class="btn-orange" onclick="showAnswer()">
            👀 Hiện đáp án
        </button>
        <div id="answer" class="answer">
            <div id="flashMeaning"></div>
            <div class="example">
                <div id="exampleChinese" class="example-chinese"></div>
                <div id="examplePinyin" class="example-pinyin"></div>
                <div id="exampleMeaning" class="example-meaning"></div>
                <button class="btn-red" onclick="speakExample()">
                    🔊 Nghe câu ví dụ
                </button>
            </div>
        </div>
        <div>
            <button class="btn-gray" onclick="notRemembered()">
                ❌ Chưa nhớ
            </button>
            <button class="btn-green" onclick="rememberCurrent()">
                ✅ Đã nhớ
            </button>
        </div>
        <div class="navigation">
            <button class="btn-gray" onclick="previousWord()">
                ← Từ trước
            </button>
            <button class="btn-gray" onclick="nextWord()">
                Từ tiếp theo →
            </button>
        </div>
        <div class="counter">
            Từ <span id="currentNumber">0</span>
            / <span id="totalNumber">0</span>
        </div>
        <div class="progress">
            📊 Đã nhớ: <span id="rememberedCount">0</span>
        </div>
    </div>
    <!-- SEARCH -->
    <div class="search-box">
        <h2>🔍 Tìm từ</h2>
        <input
            type="text"
            id="searchInput"
            placeholder="Nhập chữ Hán, pinyin hoặc nghĩa tiếng Việt..."
            oninput="searchWords()"
        >
    </div>
    <!-- WORD LIST -->
    <div class="word-list" id="wordList">
        Đang tải dữ liệu...
    </div>
</div>
<footer>
    Chinese Learning © 2026
</footer>
<script>
let words = [];
let currentIndex = 0;
/* =========================
   LƯU TỪ ĐÃ NHỚ
========================= */
let rememberedWords = JSON.parse(
    localStorage.getItem("hsk1Remembered") || "[]"
);
/* =========================
   ĐỌC TIẾNG TRUNG
========================= */
function speakChinese(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "zh-CN";
    speech.rate = 0.8;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}
/* =========================
   ĐỌC TỪ HIỆN TẠI
========================= */
function speakCurrentWord() {
    if (words.length === 0) return;
    speakChinese(words[currentIndex].chinese);
}
/* =========================
   ĐỌC CÂU VÍ DỤ
========================= */
function speakExample() {
    if (words.length === 0) return;
    speakChinese(words[currentIndex].example);
}
/* =========================
   PARSE CSV
========================= */
function parseCSV(text) {
    const rows = [];
    let row = [];
    let value = "";
    let insideQuotes = false;
    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"' && insideQuotes && next === '"') {
            value += '"';
            i++;
        } else if (char === '"') {
            insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
            row.push(value);
            value = "";
        } else if ((char === "\n" || char === "\r") && !insideQuotes) {
            if (char === "\r" && next === "\n") {
                i++;
            }
            row.push(value);
            if (row.some(cell => cell.trim() !== "")) {
                rows.push(row);
            }
            row = [];
            value = "";
        } else {
            value += char;
        }
    }
    if (value !== "" || row.length > 0) {
        row.push(value);
        if (row.some(cell => cell.trim() !== "")) {
            rows.push(row);
        }
    }
    return rows;
}
/* =========================
   LOAD CSV
========================= */
async function loadWords() {
    try {
        const response = await fetch("hsk1.csv");
        if (!response.ok) {
            throw new Error("Không đọc được file hsk1.csv");
        }
        const text = await response.text();
        const rows = parseCSV(text);
        words = rows
            .slice(1)
            .filter(row => row.length >= 6)
            .map(row => ({
                chinese: row[0].trim(),
                pinyin: row[1].trim(),
                meaning: row[2].trim(),
                example: row[3].trim(),
                examplePinyin: row[4].trim(),
                exampleMeaning: row[5].trim()
            }));
        if (words.length === 0) {
            throw new Error("File CSV không có dữ liệu.");
        }
        document.getElementById("totalNumber").textContent =
            words.length;
        updateFlashcard();
        displayWords(words);
        updateRememberedCount();
    } catch (error) {
        document.getElementById("flashWord").textContent = "⚠️ Lỗi";
        document.getElementById("flashPinyin").textContent =
            error.message;
    }
}
/* =========================
   HIỂN THỊ FLASHCARD
========================= */
function updateFlashcard() {
    if (words.length === 0) return;
    const word = words[currentIndex];
    document.getElementById("flashWord").textContent =
        word.chinese;
    document.getElementById("flashPinyin").textContent =
        word.pinyin;
    document.getElementById("flashMeaning").textContent =
        word.meaning;
    document.getElementById("exampleChinese").textContent =
        word.example;
    document.getElementById("examplePinyin").textContent =
        word.examplePinyin;
    document.getElementById("exampleMeaning").textContent =
        word.exampleMeaning;
    document.getElementById("currentNumber").textContent =
        currentIndex + 1;
    document.getElementById("answer").style.display = "none";
}
/* =========================
   HIỆN ĐÁP ÁN
========================= */
function showAnswer() {
    document.getElementById("answer").style.display = "block";
}
/* =========================
   TỪ TIẾP THEO
========================= */
function nextWord() {
    if (words.length === 0) return;
    currentIndex++;
    if (currentIndex >= words.length) {
        currentIndex = 0;
    }
    updateFlashcard();
}
/* =========================
   TỪ TRƯỚC
========================= */
function previousWord() {
    if (words.length === 0) return;
    currentIndex--;
    if (currentIndex < 0) {
        currentIndex = words.length - 1;
    }
    updateFlashcard();
}
/* =========================
   ĐÁNH DẤU ĐÃ NHỚ
========================= */
function rememberCurrent() {
    if (words.length === 0) return;
    const word = words[currentIndex].chinese;
    if (!rememberedWords.includes(word)) {
        rememberedWords.push(word);
        localStorage.setItem(
            "hsk1Remembered",
            JSON.stringify(rememberedWords)
        );
    }
    updateRememberedCount();
    nextWord();
}
/* =========================
   CHƯA NHỚ
========================= */
function notRemembered() {
    if (words.length === 0) return;
    nextWord();
}
/* =========================
   CẬP NHẬT SỐ TỪ ĐÃ NHỚ
========================= */
function updateRememberedCount() {
    document.getElementById("rememberedCount").textContent =
        rememberedWords.length;
}
/* =========================
   HIỂN THỊ DANH SÁCH TỪ
========================= */
function displayWords(list) {
    const wordList =
        document.getElementById("wordList");
    wordList.innerHTML = "";
    list.forEach((word, index) => {
        const div =
            document.createElement("div");
        div.className = "word-card";
        if (rememberedWords.includes(word.chinese)) {
            div.classList.add("remembered");
        }
        div.innerHTML = `
            <div class="word-main">
                <div>
                    <div class="word-chinese">
                        ${word.chinese}
                    </div>
                    <div class="word-pinyin">
                        ${word.pinyin}
                    </div>
                </div>
                <div class="word-meaning">
                    ${word.meaning}
                </div>
            </div>
            <div class="word-detail">
                <div>
                    ${word.example}
                </div>
                <div class="word-pinyin">
                    ${word.examplePinyin}
                </div>
                <div>
                    ${word.exampleMeaning}
                </div>
                <button
                    class="btn-red"
                    onclick="event.stopPropagation(); speakChinese('${word.example.replace(/'/g, "\\'")}')"
                >
                    🔊 Nghe câu
                </button>
            </div>
        `;
        div.onclick = function () {
            const detail =
                div.querySelector(".word-detail");
            if (detail.style.display === "block") {
                detail.style.display = "none";
            } else {
                detail.style.display = "block";
            }
        };
        wordList.appendChild(div);
    });
}
/* =========================
   TÌM KIẾM
========================= */
function searchWords() {
    const keyword =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();
    if (!keyword) {
        displayWords(words);
        return;
    }
    const result =
        words.filter(word =>
            word.chinese.toLowerCase().includes(keyword) ||
            word.pinyin.toLowerCase().includes(keyword) ||
            word.meaning.toLowerCase().includes(keyword)
        );
    displayWords(result);
}
/* =========================
   START
========================= */
loadWords();
</script>
</body>
</html>
